<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 597.0625 450" style="max-width: 597.062px; background-color: white;" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#1a1a1a;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(33.3333333333, 36%, 100%);}#my-svg .error-text{fill:rgb(0, 0, 0);stroke:rgb(0, 0, 0);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#555555;stroke:#555555;}#my-svg .marker.cross{stroke:#555555;}#my-svg svg{font-family:Arial,Helvetica,sans-serif;font-size:15px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:#ffffff;stroke-width:2px;opacity:1;}#my-svg .pieCircle.highlighted{scale:1.05;opacity:1;}#my-svg .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#my-svg .pieOuterCircle{stroke:black;stroke-width:1px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#1a1a1a;font-family:Arial,Helvetica,sans-serif;}#my-svg .slice{font-family:Arial,Helvetica,sans-serif;fill:#1a1a1a;font-size:17px;}#my-svg .legend text{fill:#1a1a1a;font-family:Arial,Helvetica,sans-serif;font-size:15px;}#my-svg .node .neo-node{stroke:#1f4e79;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#1f4e79;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="185.5" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,75.678,168.813L0,0Z" fill="#1f4e79" class="pieCircle"/><path d="M75.678,168.813A185,185,0,0,1,-184.457,14.162L0,0Z" fill="#4a7fb0" class="pieCircle"/><path d="M-184.457,14.162A185,185,0,0,1,-62.533,-174.111L0,0Z" fill="#9bbbd9" class="pieCircle"/><path d="M-62.533,-174.111A185,185,0,0,1,0,-185L0,0Z" fill="#d6e2ee" class="pieCircle"/><text transform="translate(135.68102834234847,-29.02104491507555)" class="slice" style="text-anchor: middle; fill: #ffffff;">71</text><text transform="translate(-70.90384177328659,119.26528296947416)" class="slice" style="text-anchor: middle; fill: #ffffff;">50</text><text transform="translate(-116.46195287580797,-75.41999756266958)" class="slice" style="text-anchor: middle; fill: #1a1a1a;">34</text><text transform="translate(-23.802794427004443,-136.69304838749397)" class="slice" style="text-anchor: middle; fill: #1a1a1a;">9</text></g><text x="0" y="-200" class="pieTitleText"/><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(31, 78, 121); stroke: rgb(31, 78, 121);"/><text x="22" y="14">cloud</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(74, 127, 176); stroke: rgb(74, 127, 176);"/><text x="22" y="14">gateway</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(155, 187, 217); stroke: rgb(155, 187, 217);"/><text x="22" y="14">tooling</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(214, 226, 238); stroke: rgb(214, 226, 238);"/><text x="22" y="14">device</text></g></g></svg>